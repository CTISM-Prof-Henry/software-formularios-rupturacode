[project]
name = "software-formularios-rupturacode"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.3",
]

[tool.pylint.main]
django-settings-module = "atlas.settings"
ignore = ["migrations", ".venv", "frontend"]
load-plugins = ["pylint_django"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.messages_control]
disable = [
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "too-few-public-methods",
]
